<svg xmlns="http://www.w3.org/2000/svg" width="640" height="48" viewBox="0 0 640 48" role="img" aria-label="I turn passing ideas into working projects.">
  <title>I turn passing ideas into working projects.</title>
  <defs>
    <mask id="reveal">
      <rect x="0" y="0" width="0" height="48" fill="#fff">
        <animate attributeName="width" values="0;440;440;0" keyTimes="0;0.42;0.84;1" dur="7s" repeatCount="indefinite"/>
      </rect>
    </mask>
  </defs>

  <text x="4" y="30" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#8b949e" mask="url(#reveal)">
    I turn passing ideas into <tspan fill="#58a6ff">working projects.</tspan>
  </text>

  <line x1="4" y1="40" x2="4" y2="40" stroke="#58a6ff" stroke-width="1.25" stroke-linecap="round">
    <animate attributeName="x2" values="4;4;428;428;4" keyTimes="0;0.42;0.58;0.84;1" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.42;0.44;0.84;1" dur="7s" repeatCount="indefinite"/>
  </line>
</svg>
